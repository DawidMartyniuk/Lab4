name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04 
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4 

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5 
        with:
          python-version: '3.9'

      - name: Instalacja zależności
        run: |
          pip install -r requirements.txt

      - name: Uruchomienie testów
        run: |
          pytest test_app.py

  deploy:
    needs: build-and-test
    runs-on: ubuntu-24.04 
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4 

      - name: Budowa obrazu Dockera (Symulacja Deployu)
        run: |
          docker build -t moja-aplikacja:latest .
          echo "Wdrożenie zakończone sukcesem!"